services:
  # MediaMTX RTSP Server
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: skylark-mediamtx
    ports:
      - "8554:8554"  # RTSP port
      - "1935:1935"  # RTMP port
      - "8888:8888"  # HLS port
      - "8889:8889"  # WebRTC port
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  # FFmpeg RTSP Test Stream Generator (publishes test pattern to MediaMTX)
  stream-generator:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: skylark-stream-generator
    command: >
      -re -f lavfi -i testsrc=size=1280x720:rate=30
      -f lavfi -i sine=frequency=1000:sample_rate=44100
      -c:v libx264 -preset ultrafast -tune zerolatency
      -c:a aac -f rtsp rtsp://mediamtx:8554/live/stream
    depends_on:
      - mediamtx
    restart: always

  # Go Backend Service
  backend:
    build: ./backend
    container_name: skylark-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - mediamtx
    restart: unless-stopped

  # Frontend Service (React + TypeScript + Vite)
  frontend:
    build: ./frontend
    container_name: skylark-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_URL=ws://localhost:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
